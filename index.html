/* =========================================================
   VARIABLES
========================================================= */

:root {

    --negro: #100d0b;
    --negro-suave: #191411;

    --marron-oscuro: #2b1b14;
    --marron: #5b3825;
    --marron-claro: #8b5e3c;

    --crema: #f1e4cf;
    --crema-claro: #faf5ec;

    --dorado: #c7a45b;
    --dorado-claro: #e2c47a;

    --blanco: #ffffff;
    --gris: #c9c0b5;

    --sombra:
        0 15px 45px rgba(0,0,0,0.35);
}


/* =========================================================
   GENERAL
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    scroll-behavior: smooth;

}

html {
    scroll-behavior: smooth;
}

body {

    font-family:
        "Cormorant Garamond",
        serif;

    background:
        var(--negro);

    color:
        var(--crema);

    line-height:
        1.6;

    overflow-x:
        hidden;

}

a {

    text-decoration:
        none;

    color:
        inherit;

}

button {

    font-family:
        inherit;

}

img {

    max-width:
        100%;

    display:
        block;

}


/* =========================================================
   HEADER
========================================================= */

header {

    position:
        fixed;

    top:
        0;

    left:
        0;

    width:
        100%;

    z-index:
        1000;

    background:
        rgba(16,13,11,0.95);

    backdrop-filter:
        blur(10px);

    border-bottom:
        1px solid
        rgba(199,164,91,0.25);

}

.nav-container {

    max-width:
        1250px;

    margin:
        auto;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        16px 25px;

}

.logo {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--dorado);

    font-size:
        1.65rem;

    font-weight:
        700;

    letter-spacing:
        4px;

}

.logo span {

    display:
        block;

    font-family:
        "Cormorant Garamond",
        serif;

    font-size:
        0.75rem;

    letter-spacing:
        3px;

    text-align:
        center;

    color:
        var(--crema);

}

nav ul {

    display:
        flex;

    list-style:
        none;

    gap:
        27px;

}

nav a {

    font-family:
        "Cinzel",
        serif;

    font-size:
        0.78rem;

    letter-spacing:
        1px;

    color:
        var(--crema);

    transition:
        0.3s;

}

nav a:hover {

    color:
        var(--dorado-claro);

}

.menu-btn {

    display:
        none;

    background:
        none;

    border:
        none;

    color:
        var(--crema);

    font-size:
        1.5rem;

    cursor:
        pointer;

}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height:
        100vh;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    background:

        linear-gradient(
            rgba(10,7,5,0.62),
            rgba(10,7,5,0.82)
        ),

        url("https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=2000&q=85");

    background-size:
        cover;

    background-position:
        center;

    background-attachment:
        fixed;

}

.hero::after {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,0.65) 100%
        );

}

.hero-content {

    position:
        relative;

    z-index:
        2;

    max-width:
        900px;

    padding:
        30px;

}

.hero-small {

    font-family:
        "Cinzel",
        serif;

    letter-spacing:
        6px;

    color:
        var(--dorado-claro);

    font-size:
        0.9rem;

    margin-bottom:
        15px;

}

.hero h1 {

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(4rem,12vw,9rem);

    line-height:
        0.9;

    letter-spacing:
        15px;

    color:
        var(--crema);

    text-shadow:
        0 5px 30px
        rgba(0,0,0,0.8);

}

.hero h2 {

    font-size:
        clamp(1.5rem,3vw,2.5rem);

    font-weight:
        400;

    color:
        var(--dorado-claro);

    margin:
        25px 0 15px;

}

.hero p {

    font-size:
        1.25rem;

    max-width:
        650px;

    margin:
        auto;

    color:
        var(--crema);

}

.hero-buttons {

    margin-top:
        35px;

    display:
        flex;

    justify-content:
        center;

    gap:
        15px;

    flex-wrap:
        wrap;

}

.btn {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        9px;

    padding:
        13px 25px;

    border:
        1px solid
        var(--dorado);

    font-family:
        "Cinzel",
        serif;

    font-size:
        0.8rem;

    letter-spacing:
        1px;

    transition:
        0.3s;

    cursor:
        pointer;

}

.btn-primary {

    background:
        var(--dorado);

    color:
        var(--negro);

}

.btn-primary:hover {

    background:
        var(--dorado-claro);

    transform:
        translateY(-3px);

}

.btn-outline {

    background:
        transparent;

    color:
        var(--crema);

}

.btn-outline:hover {

    background:
        var(--dorado);

    color:
        var(--negro);

    transform:
        translateY(-3px);

}

.scroll-down {

    position:
        absolute;

    bottom:
        30px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        3;

    color:
        var(--dorado);

    font-size:
        1.5rem;

    animation:
        bajar 1.7s infinite;

}

@keyframes bajar {

    0%,100% {
        transform:
            translate(-50%,0);
    }

    50% {
        transform:
            translate(-50%,10px);
    }

}


/* =========================================================
   SECCIONES
========================================================= */

section {

    padding:
        100px 25px;

}

.container {

    max-width:
        1150px;

    margin:
        auto;

}

.section-header {

    text-align:
        center;

    margin-bottom:
        60px;

}

.section-subtitle {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--dorado);

    font-size:
        0.8rem;

    letter-spacing:
        4px;

    margin-bottom:
        10px;

}

.section-title {

    font-family:
        "Cinzel",
        serif;

    font-size:
        clamp(2rem,5vw,3.3rem);

    color:
        var(--crema);

}

.gold-line {

    width:
        80px;

    height:
        2px;

    background:
        var(--dorado);

    margin:
        20px auto;

}

.section-description {

    max-width:
        700px;

    margin:
        auto;

    font-size:
        1.15rem;

    color:
        var(--gris);

}


/* =========================================================
   INTRO
========================================================= */

.intro {

    background:
        linear-gradient(
            135deg,
            #17100d,
            #291912
        );

}

.intro-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        60px;

    align-items:
        center;

}

.intro-image {

    min-height:
        500px;

    background:
        url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=85");

    background-size:
        cover;

    background-position:
        center;

    border:
        1px solid
        rgba(199,164,91,0.4);

    box-shadow:
        var(--sombra);

}

.intro-text h3 {

    font-family:
        "Cinzel",
        serif;

    font-size:
        2rem;

    color:
        var(--dorado-claro);

    margin-bottom:
        20px;

}

.intro-text p {

    font-size:
        1.15rem;

    color:
        var(--gris);

    margin-bottom:
        20px;

}

.ornament {

    color:
        var(--dorado);

    font-size:
        2rem;

    margin-bottom:
        15px;

}


/* =========================================================
   MISIÓN / VISIÓN
========================================================= */

.mission {

    background:
        var(--crema-claro);

    color:
        var(--marron-oscuro);

}

.mission .section-title {

    color:
        var(--marron-oscuro);

}

.mission .section-description {

    color:
        #69584b;

}

.mission-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        30px;

}

.mission-card {

    padding:
        45px 35px;

    border:
        1px solid
        rgba(91,56,37,0.3);

    background:
        #f7edde;

    text-align:
        center;

    transition:
        0.4s;

}

.mission-card:hover {

    transform:
        translateY(-8px);

    box-shadow:
        0 15px 40px
        rgba(45,30,20,0.15);

}

.mission-card i {

    font-size:
        2.5rem;

    color:
        var(--marron);

    margin-bottom:
        20px;

}

.mission-card h3 {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--marron);

    margin-bottom:
        15px;

    font-size:
        1.5rem;

}

.mission-card p {

    font-size:
        1.1rem;

}


/* =========================================================
   OBJETIVOS
========================================================= */

.objectives {

    background:

        linear-gradient(
            rgba(18,12,9,0.95),
            rgba(18,12,9,0.95)
        ),

        url("https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=1800&q=80");

    background-size:
        cover;

    background-position:
        center;

}

.objective-grid {

    display:
        grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:
        20px;

}

.objective-card {

    padding:
        35px 25px;

    background:
        rgba(43,27,20,0.75);

    border:
        1px solid
        rgba(199,164,91,0.25);

    transition:
        0.35s;

}

.objective-card:hover {

    transform:
        translateY(-7px);

    border-color:
        var(--dorado);

    background:
        rgba(70,43,28,0.8);

}

.objective-number {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--dorado);

    font-size:
        2.5rem;

}

.objective-card h3 {

    font-family:
        "Cinzel",
        serif;

    margin:
        12px 0;

    color:
        var(--crema);

}

.objective-card p {

    color:
        var(--gris);

}


/* =========================================================
   VALORES
========================================================= */

.values {

    background:
        #0e0b09;

}

.values-grid {

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:
        20px;

}

.value-card {

    text-align:
        center;

    padding:
        40px 20px;

    border:
        1px solid
        rgba(199,164,91,0.25);

    transition:
        0.35s;

}

.value-card:hover {

    background:
        var(--marron-oscuro);

    transform:
        translateY(-8px);

}

.value-card i {

    font-size:
        2rem;

    color:
        var(--dorado);

    margin-bottom:
        18px;

}

.value-card h3 {

    font-family:
        "Cinzel",
        serif;

    margin-bottom:
        10px;

}

.value-card p {

    color:
        var(--gris);

}


/* =========================================================
   CARTA
========================================================= */

.menu-section {

    background:
        linear-gradient(
            rgba(35,22,16,0.97),
            rgba(25,16,11,0.98)
        );

}

.menu-categories {

    display:
        flex;

    justify-content:
        center;

    flex-wrap:
        wrap;

    gap:
        10px;

    margin-bottom:
        40px;

}

.category-btn {

    padding:
        11px 20px;

    background:
        transparent;

    color:
        var(--crema);

    border:
        1px solid
        rgba(199,164,91,0.4);

    font-family:
        "Cinzel",
        serif;

    font-size:
        0.75rem;

    cursor:
        pointer;

    transition:
        0.3s;

}

.category-btn:hover,
.category-btn.active {

    background:
        var(--dorado);

    color:
        var(--negro);

}

.products-grid {

    display:
        grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:
        25px;

}

.product-card {

    background:
        #1d130e;

    border:
        1px solid
        rgba(199,164,91,0.2);

    overflow:
        hidden;

    transition:
        0.4s;

}

.product-card:hover {

    transform:
        translateY(-8px);

    box-shadow:
        var(--sombra);

    border-color:
        var(--dorado);

}

.product-image {

    height:
        230px;

    overflow:
        hidden;

}

.product-image img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    transition:
        0.5s;

}

.product-card:hover
.product-image img {

    transform:
        scale(1.08);

}

.product-info {

    padding:
        22px;

}

.product-info h3 {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--crema);

    margin-bottom:
        8px;

}

.product-info p {

    color:
        var(--gris);

    font-size:
        1rem;

    min-height:
        55px;

}

.product-bottom {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-top:
        18px;

}

.price {

    color:
        var(--dorado-claro);

    font-family:
        "Cinzel",
        serif;

    font-size:
        1.2rem;

    font-weight:
        700;

}

.add-btn {

    background:
        var(--dorado);

    border:
        none;

    color:
        var(--negro);

    padding:
        10px 15px;

    cursor:
        pointer;

    font-weight:
        bold;

    transition:
        0.3s;

}

.add-btn:hover {

    background:
        var(--dorado-claro);

    transform:
        scale(1.05);

}


/* =========================================================
   CARRITO
========================================================= */

.cart-box {

    position:
        fixed;

    right:
        20px;

    bottom:
        90px;

    width:
        350px;

    max-width:
        calc(100% - 40px);

    background:
        #21150f;

    border:
        1px solid
        var(--dorado);

    box-shadow:
        var(--sombra);

    z-index:
        900;

    transform:
        translateY(120%);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        0.4s;

}

.cart-box.show {

    transform:
        translateY(0);

    opacity:
        1;

    pointer-events:
        auto;

}

.cart-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        18px;

    background:
        var(--marron-oscuro);

    border-bottom:
        1px solid
        rgba(199,164,91,0.3);

}

.cart-header h3 {

    font-family:
        "Cinzel",
        serif;

    color:
        var(--dorado);

}

.close-cart {

    background:
        none;

    border:
        none;

    color:
        var(--crema);

    cursor:
        pointer;

    font-size:
        1.2rem;

}

.cart-items {

    max-height:
        300px;

    overflow-y:
        auto;

    padding:
        15px;

}

.cart-item {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        10px;

    padding:
        12px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

}

.cart-item-name {

    font-weight:
        600;

}

.cart-item-price {

    color:
        var(--dorado);

}

.cart-item-controls {

    display:
        flex;

    gap:
        5px;

    align-items:
        center;

}

.cart-item-controls button {

    width:
        25px;

    height:
        25px;

    border:
        none;

    background:
        var(--marron);

    color:
        white;

    cursor:
        pointer;

}

.cart-total {

    padding:
        18px;

    display:
        flex;

    justify-content:
        space-between;

    font-family:
        "Cinzel",
        serif;

    border-top:
        1px solid
        rgba(199,164,91,0.3);

}

.cart-total strong {

    color:
        var(--dorado-claro);

}

.cart-actions {

    padding:
        15px;

}

.cart-actions button {

    width:
        100%;

    border:
        none;

    padding:
        13px;

    background:
        #25D366;

    color:
        white;

    font-weight:
        bold;

    cursor:
        pointer;

}

.empty-cart {

    text-align:
        center;

    color:
        var(--gris);

    padding:
        30px 10px;

}

.cart-floating {

    position:
        fixed;

    right:
        25px;

    bottom:
        25px;

    width:
        58px;

    height:
        58px;

    border-radius:
        50%;

    background:
        var(--dorado);

    color:
        var(--negro);

    border:
        none;

    font-size:
        1.3rem;

    cursor:
        pointer;

    z-index:
        1000;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,0.5);

    transition:
        0.3s;

}

.cart-floating:hover {

    transform:
        scale(1.1);

}

.cart-count {

    position:
        absolute;

    top:
        -5px;

    right:
        -5px;

    width:
        22px;

    height:
        22px;

    border-radius:
        50%;

    background:
        #b7352c;

    color:
        white;

    font-size:
        0.75rem;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}


/* =========================================================
   GALERÍA
========================================================= */

    background:
        var(--crema-claro);

}

.gallery .section-title {

    color:
        var(--marron-oscuro);

}

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-auto-rows:

    gap:
        12px;

}

    overflow:
        hidden;

    position:
        relative;

}
